name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S firmware/test/host -B build-host
      - name: Build
        run: cmake --build build-host --parallel
      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  firmware:
    name: Firmware build (ESP-IDF v6.0.3, esp32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.3
          target: esp32
          path: firmware
